encoder:
    # marker-agnostic part
    ma_layers_blocks: [4,]
    ma_embedding_dims: [16,]
    # pan-marker part
    pm_layers_blocks: [4, 4, 4]
    pm_embedding_dims: [192, 384, 768]

    hyperkernel:
      kernel_size: 1
      padding: 0
      stride: 1
      use_bias: true

classifier:
  hidden_dims: [512, 128]

# Head selection: "logistic" (mean-pool + MLP) or "abmil" (attention MIL)
head_type: abmil

# ABMIL parameters — only used when head_type: abmil
abmil:
  hidden_dim: 128
  gated: true
  dropout: 0.5
  classifier_hidden_dims: [128]

# Data configuration
machine: szary
dataset_subsets: [['danenberg', 'Grade']]
panel_config: configs/all_panels_config.yaml
saliency_config: configs/saliency_config.yaml
tokenizer_config: configs/all_markers_tokenizer.yaml
input_image_size: [64, 64]
max_crops_per_image: 64
num_workers: 8
batch_size: 4

# Training configuration
device: cuda
encoder_lr: 5e-5
classifier_lr: 5e-3
final_lr: 1e-5
weight_decay: 0.0001
gradient_accumulation_steps: 4
epochs: 20
frac_warmup_steps: 0.1
encoder_checkpoints_path:
  szary: /raid_encrypted/immucan/models/
  local: models/
from_checkpoint: ImmuVis-616-MSE-768-ma1.pth
finetuning_checkpoints_dir: models_finetuning/
save_checkpoint_freq: 5
imbalance_strategy: weighted_sampler
weighted_sampler_num_samples: 400

# Comet.ml logging configuration
tags: [danenberg]
comet_project: 'immuvis-finetuning'
comet_workspace: null
comet_api_key: null
